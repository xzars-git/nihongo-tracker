<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本語 Tracker · Arsenius</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17181c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/icon-180.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23F2C200'/><text x='16' y='24' font-size='20' text-anchor='middle' font-family='sans-serif' font-weight='900'>日</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@800&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css?v=9ab04fc8">
</head>
<body>
<header class="top">
  <nav class="nav mono"><span class="tag">日本語 TRACKER · ARSENIUS</span><a href="english.html" data-i="nav.english"></a><a href="about.html" data-i="nav.about"></a><a href="metode.html" data-i="nav.method"></a><a href="https://arsenius-portfolio.vercel.app" target="_blank" rel="noopener" data-i="nav.portfolio"></a><span class="lang" id="lang"></span></nav>
  <h1><span class="plate" id="n3a">JLPT N3</span><span class="plate plate-y" id="n3b"></span></h1>
  <div class="hero-row"><p class="n3left" id="n3left"></p><button type="button" class="gacha" id="flexOpen" data-i="fx.open"></button></div>
  <p class="mono muted small" id="updated"></p>
  <div id="banner"></div>
</header>

<dialog class="fx-dlg" id="flexDlg">
  <div class="fx-head"><h2 data-i="h.flex"></h2><button type="button" class="x" id="flexClose" data-i="fx.close"></button></div>
  <p class="mono muted small" data-i="fx.desc"></p>
  <div class="flex">
    <div class="fx-stage"><canvas id="flexCanvas" width="1080" height="1920" aria-label="Story image preview"></canvas><div class="fx-cover" id="flexCover"><div class="cbar">CONSOLE<span>×</span></div><div class="cl"><p class="cmd">&gt; press GACHA_</p></div></div><span class="fx-rar mono" id="flexRar" aria-live="polite"></span></div>
    <div class="fx-ctrl">
      <div class="btns"><button type="button" class="gacha" id="flexStats" data-i="fx.stats"></button><button type="button" id="flexWeek" data-i="fx.week"></button><button type="button" id="flexTheme" data-i="fx.theme"></button></div>
      <button type="button" class="gacha" id="flexPull" data-i="fx.pull"></button>
      <p class="mono small muted" id="flexInfo"></p>
      <div class="fx-q"><label><input type="checkbox" id="flexQ" checked> <span data-i="fx.quote"></span></label><select id="flexQTag" aria-label="Quote"></select><button type="button" id="flexQNew" data-i="fx.quoteNew"></button></div>
      <div class="btns"><button type="button" id="flexShare" disabled data-i="fx.share"></button><button type="button" id="flexSave" disabled data-i="fx.save"></button></div>
    </div>
  </div>
</dialog>

<main>
  <button type="button" class="gacha" id="backToday" hidden data-i="view.back"></button>
  <div class="sum">
    <div class="tile hi"><span class="lb" id="sumLabel" data-i="sum.today"></span><b id="sumHours"></b><small id="sumHoursSub"></small></div>
    <div class="tile"><span class="lb" data-i="sum.missions"></span><b id="sumMissions"></b><small id="sumMissionsSub"></small></div>
    <div class="tile"><span class="lb" data-i="sum.streak"></span><b id="sumStreak"></b><small data-i="streak.days"></small></div>
    <div class="tile"><span class="lb" data-i="sum.week"></span><b id="sumWeek"></b><small id="sumWeekSub"></small></div>
  </div>
  <div id="alerts"></div>
  <p class="praise mono" id="praise"></p>

  <div class="dash">
    <section>
      <h2><span id="todayH" data-i="h.today"></span> <span class="mono muted" id="todayLabel"></span></h2>
      <div class="wajib" id="wajib"></div>
    </section>

    <section>
      <h2 data-i="h.consistency"></h2>
      <div class="heat" id="heat"></div>
      <p class="mono muted small" data-i="heat.legend"></p>
    </section>

    <section>
      <h2 data-i="h.progress"></h2>
      <h3 class="sub3"><span data-i="h.week"></span> <span class="mono muted" id="weekLabel"></span></h3>
      <div class="bars" id="week"></div>
      <h3 class="sub3" data-i="h.n3"></h3>
      <div class="bars" id="n3bars"></div>
    </section>

    <section>
      <h2 data-i="h.mistakes"></h2>
      <p class="mono muted small" id="mistakeSum"></p>
      <div class="weak" id="weak"></div>
      <div class="mistakes" id="mistakes"></div>
    </section>
  </div>

  <details class="charts" id="logBox" open><summary class="mono" data-i="h.log"></summary><p class="mono muted small" id="logNote"></p><div class="log" id="log"></div></details>

  <details class="charts" id="badges" open></details>

  <details class="charts" open><summary class="mono" data-i="charts"></summary>
    <section class="two">
      <div><h2 data-i="h.kanji"></h2><p class="mono muted small" data-i="kanji.sub"></p><div class="chart" id="kanjiChart"></div></div>
      <div><h2>Anki</h2><p class="mono muted small"><span data-i="anki.sub"></span> <i class="sw again"></i>Again <i class="sw hard"></i>Hard <i class="sw good"></i><span data-i="other"></span></p><div class="chart" id="ankiChart"></div></div>
    </section>
  </details>
</main>
<footer class="mono muted small"><span data-i="footer"></span> <a href="metode.html" data-i="nav.method"></a>.</footer>
<p class="tip mono small" id="tip" hidden></p>
<script src="assets/js/i18n.js?v=4337ce9b"></script>
<script src="assets/js/flex.js?v=60c0aa3b"></script>
<script src="assets/js/app.js?v=ec38979d"></script>
<script>
  const dlg = document.getElementById("flexDlg");
  document.getElementById("flexOpen").onclick = () => dlg.showModal();
  document.getElementById("flexClose").onclick = () => dlg.close();
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });  // tap backdrop to close
</script>
<script src="assets/js/pwa.js?v=f07ddea9"></script>
</body>
</html>
